[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lanes-fuzz"
version = "0.1.0"
description = "Property-based fuzzer for the bloqade-lanes compilation pipeline (not part of the bloqade-lanes package)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # The code under test, built from this checkout (non-editable, so the fuzzer
    # runs against exactly the commit it was installed from).
    "bloqade-lanes",
    "hypothesis==6.152.5",
    "pytest==9.1.1",
    "stim==1.16.0",
]

[tool.uv.sources]
bloqade-lanes = { path = ".." }

[tool.uv]
# Every package the repo's own test environment (`uv sync --locked --dev
# --extra sim`) installs, at the version it installs, so the fuzzer exercises
# the same dependency set the project is tested with.
constraint-dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "beartype==0.22.9",
    "beliefmatching==0.2.0",
    "binapy==0.8.0",
    "bloqade-circuit==0.15.2",
    "bloqade-core==0.6.13",
    "bloqade-decoders==0.6.1",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.1",
    "contourpy==1.4.0",
    "cryptography==50.0.1",
    "cycler==0.12.1",
    "deprecated==1.3.1",
    "dnspython==2.8.0",
    "email-validator==2.3.0",
    "fonttools==4.65.0",
    "furl==2.1.4",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "iniconfig==2.3.0",
    "jwskate==0.12.2",
    "kahip==3.25",
    "kirin-toolchain==0.22.16",
    "kiwisolver==1.5.1",
    "lark==1.3.1",
    "ldpc==2.4.1",
    "loguru==0.7.3",
    "markdown-it-py==4.2.0",
    "matplotlib==3.11.2",
    "mdurl==0.1.2",
    "networkx==3.7",
    "numpy==2.2.6",
    "orderedmultidict==1.0.2",
    "packaging==26.3",
    "pandas==2.3.3",
    "pillow==12.3.0",
    "pluggy==1.6.0",
    "pycparser==3.0",
    "pydantic==2.10.6",
    "pydantic-core==2.27.2",
    "pygments==2.21.0",
    "pymatching==2.4.0",
    "pymongo==4.18.1",
    "pytz==2026.3.post1",
    "pyparsing==3.3.3",
    "pyqrack-cpu==1.89.0",
    "pytest==9.1.1",
    "python-dateutil==2.9.0.post0",
    "qlam-core==0.8.0",
    "requests==2.34.2",
    "requests-oauth2client==1.8.0",
    "rich==15.0.0",
    "rustworkx==0.18.1",
    "scipy==1.18.1",
    "segno==1.6.6",
    "semver==3.1.0",
    "sinter==1.16.0",
    "six==1.17.0",
    "stim==1.16.0",
    "tqdm==4.70.1",
    "typing-extensions==4.16.0",
    "tzdata==2026.4",
    "urllib3==2.8.0",
    "wrapt==2.4.1",
